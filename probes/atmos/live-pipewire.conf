# Isolated daemon: no hardware nodes, host sockets, or startup commands.
# Based on PipeWire 0.3.65 minimal.conf.in factory contracts.
context.properties = {
    core.daemon = true
    core.name = pipewire-live-atmos
    support.dbus = false
    mem.allow-mlock = false
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 256
    default.clock.max-quantum = 256
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = live-atmos-driver
        node.group = pipewire.dummy
        node.freewheel = false
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = live-atmos-null
        media.class = Audio/Sink
        audio.rate = 48000
        audio.channels = 12
        audio.position = [ FL FR FC LFE RL RR SL SR TFL TFR TRL TRR ]
        channelmix.disable = true
        resample.disable = true
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = live-atmos-stereo
        media.class = Audio/Sink
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        channelmix.disable = true
        resample.disable = true
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = fallback-stereo
        media.class = Audio/Sink
        priority.session = 1000
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
context.exec = []
