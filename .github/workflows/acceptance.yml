name: Reviewed audio acceptance
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Reviewed lane to run; do not repeat already passing lanes'
        required: true
        type: choice
        options: [all, repository, speaker, installation, latency, coreaudio, audio-path, atmos, atmos-energy, atmos-live, manual-annotations]
        default: all
      selection:
        description: 'all, or a stage from the selected lane; use test_ids for failed cases'
        required: true
        default: all
      test_ids:
        description: 'Space-separated failed unittest IDs (Atmos accepts method names)'
        default: ''
permissions:
  contents: read
concurrency:
  group: audio-acceptance-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  repository:
    if: inputs.lane == 'all' || inputs.lane == 'repository'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/check_repository.py
  speaker:
    if: inputs.lane == 'all' || inputs.lane == 'speaker'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SELECTION: ${{ inputs.selection }}
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash scripts/ci_speaker.sh "$SELECTION" "$TEST_IDS"
  latency:
    if: inputs.lane == 'all' || inputs.lane == 'latency'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SELECTION: ${{ inputs.selection }}
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker pull ubuntu@sha256:ee126c2fa0249079a7e24ae3a3d29b04783ef93ab33c868751c9a1289d3fffff
      - shell: bash
        run: |
          mkdir -p build
          read -r -a ids <<< "$TEST_IDS"
          args=()
          for id in "${ids[@]}"; do args+=(--test-id "$id"); done
          python3 scripts/validate_audio_linux.py --stage "$SELECTION" "${args[@]}" --output build/latency-result.json
      - if: always()
        run: if test -f build/latency-result.json; then cat build/latency-result.json; fi
  atmos:
    if: inputs.lane == 'all' || inputs.lane == 'atmos'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir -p build
          read -r -a ids <<< "$TEST_IDS"
          args=()
          for id in "${ids[@]}"; do args+=(--test "$id"); done
          bash probes/atmos/ci.sh --report build/atmos-result.json "${args[@]}"
      - if: always()
        run: if test -f build/atmos-result.json; then cat build/atmos-result.json; fi

  installation:
    if: inputs.lane == 'all' || inputs.lane == 'installation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTION: ${{ inputs.selection }}
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage pinned public source
        shell: bash
        run: |
          mkdir -p build
          git init build/easyeffects-git
          git -C build/easyeffects-git remote add origin https://github.com/wwmm/easyeffects.git
          git -C build/easyeffects-git fetch --depth=1 origin 6d9b1220d3dcebb154ba759a05600662bc0af549
          git -C build/easyeffects-git checkout --detach FETCH_HEAD
          python3 scripts/build_easyeffects_runtime.py source --source build/easyeffects-git --output build/easyeffects-source
      - name: Run selected reviewed tests
        shell: bash
        run: |
          export ROG_EASYEFFECTS_GIT="$PWD/build/easyeffects-git"
          export ROG_EASYEFFECTS_SOURCE="$PWD/build/easyeffects-source"
          read -r -a ids <<< "$TEST_IDS"
          args=()
          for id in "${ids[@]}"; do args+=(--test-id "$id"); done
          python3 scripts/validate_speaker_install.py --stage "$SELECTION" "${args[@]}"

  coreaudio:
    if: inputs.lane == 'all' || inputs.lane == 'coreaudio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run selected offline CoreAudio summary tests
        shell: bash
        run: |
          PYTHONPATH=scripts:tests python3 - <<'PYTEST'
          import os
          import re
          import unittest
          ids = os.environ['TEST_IDS'].split()
          module = 'test_analyse_coreaudio_latency'
          if len(ids) > 128 or len(set(ids)) != len(ids) or any(
              not re.fullmatch(module + r'\.[A-Za-z_][A-Za-z0-9_]*\.test_[A-Za-z0-9_]+', item)
              for item in ids
          ):
              raise SystemExit('Invalid CoreAudio test selection')
          suite = unittest.defaultTestLoader.loadTestsFromNames(ids or [module])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PYTEST

  audio-path:
    if: inputs.lane == 'all' || inputs.lane == 'audio-path'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTION: ${{ inputs.selection }}
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build isolated pinned filter environment
        run: docker build --platform linux/amd64 -f tests/audio/latency-path.Dockerfile -t rog-audio-path-ci tests/audio
      - name: Run selected new path checks
        shell: bash
        run: |
          stages=(unit-path unit-trial compile config filter-match filter-other-app filter-other-node filter-other-group filter-other-role filter-env-latency filter-env-quantum)
          if [[ "$SELECTION" != all ]]; then
            found=false
            for stage in "${stages[@]}"; do
              if [[ "$stage" == "$SELECTION" ]]; then found=true; fi
            done
            "$found" || { echo 'Unknown audio-path stage'; exit 2; }
            stages=("$SELECTION")
          fi
          read -r -a ids <<< "$TEST_IDS"
          if [[ ${#ids[@]} -gt 0 && "$SELECTION" != unit-path && "$SELECTION" != unit-trial ]]; then
            echo 'Failed test IDs require a single unit stage'; exit 2
          fi
          container="rog-audio-path-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          result=0
          for stage in "${stages[@]}"; do
            if docker run --rm --pull=never --platform linux/amd64 --name "$container" \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,exec,size=128m \
              --env PYTHONDONTWRITEBYTECODE=1 \
              --mount "type=bind,src=$PWD,dst=/repo,readonly" \
              rog-audio-path-ci sh /repo/tests/audio/linux-path-validation.sh "$stage" "${ids[@]}"; then
              echo "PASS $stage"
            else
              echo "FAIL $stage"
              result=1
            fi
          done
          exit "$result"

  atmos-energy:
    if: inputs.lane == 'all' || inputs.lane == 'atmos-energy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TEST_IDS: ${{ inputs.test_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run selected offline channel-energy methods
        shell: bash
        run: |
          mkdir -p build
          read -r -a ids <<< "$TEST_IDS"
          args=()
          for id in "${ids[@]}"; do args+=(--test-id "$id"); done
          python3 scripts/validate_atmos_energy.py --report build/atmos-energy-result.json "${args[@]}"
      - if: always()
        run: if test -f build/atmos-energy-result.json; then cat build/atmos-energy-result.json; fi

  manual-annotations:
    if: inputs.lane == 'all' || inputs.lane == 'manual-annotations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TEST_IDS: ${{ inputs.test_ids }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run only selected offline annotation methods
        shell: bash
        run: |
          mkdir -p build
          read -r -a ids <<< "$TEST_IDS"
          args=()
          for id in "${ids[@]}"; do args+=(--test-id "$id"); done
          python3 scripts/validate_manual_annotations.py --report build/manual-annotations-result.json "${args[@]}"
      - if: always()
        run: if test -f build/manual-annotations-result.json; then cat build/manual-annotations-result.json; fi

  atmos-live:
    if: inputs.lane == 'atmos-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SELECTION: ${{ inputs.selection }}
      TEST_IDS: ${{ inputs.test_ids }}
      ATMOS_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned live-only toolchain
        shell: bash
        run: |
          mkdir -p build/Cavern
          git -C build/Cavern init
          git -C build/Cavern remote add origin https://github.com/VoidXH/Cavern.git
          git -C build/Cavern fetch --depth=1 origin 7d85d1880666ca5ea323848cff47ce7f50b29f7d
          git -C build/Cavern checkout --detach FETCH_HEAD
          docker build --target live-ci -t rog-audio-atmos-live:reviewed -f probes/atmos/Dockerfile probes/atmos
      - name: Run only selected reviewed live methods or cases
        shell: bash
        run: |
          case "$SELECTION" in all|units|integration) ;; *) echo 'selection must be all, units or integration' >&2; exit 2;; esac
          read -r -a ids <<< "$TEST_IDS"
          args=()
          if [[ "$SELECTION" == integration ]]; then
            for id in "${ids[@]}"; do args+=(--case "$id"); done
          elif [[ "$SELECTION" == units ]]; then
            for id in "${ids[@]}"; do args+=(--test-id "$id"); done
          elif (( ${#ids[@]} )); then
            echo 'select units or integration for exact retries' >&2; exit 2
          fi
          sh probes/atmos/live-ci.sh --image rog-audio-atmos-live:reviewed \
            --source build/Cavern --report build/atmos-live-result.json \
            --stage "$SELECTION" "${args[@]}"
      - if: always()
        run: if test -f build/atmos-live-result.json; then cat build/atmos-live-result.json; fi
